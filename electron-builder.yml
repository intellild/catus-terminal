productName: "Catus Terminal"
appId: com.lynxtron.catus.terminal
directories:
  buildResources: resources
  output: dist
  app: dist/desktop
files:
  - index.js
  - '**/*.lynx.bundle'
  - '**/*.js'
  - '**/*.css'
  - '**/*.html'
  - '**/*.json'
  - '**/*.jsn'
  - '**/*.png'
  - '**/*.exe'
asar: true
asarUnpack:
  - statics/
npmRebuild: false
extraResources:
  - from: src/assets
    to: assets
icon: resources/catus.png
electronBranding:
  projectName: lynxtron
  productName: Lynxtron
mac:
  icon: resources/catus.icns
  artifactName: CatusTerminal-v${version}-darwin-${arch}.${ext}
  extendInfo:
    CFBundleURLSchemes:
      - CatusTerminal
  identity: null
win:
  icon: resources/catus.ico
  target:
    - target: nsis
      arch: x64
  artifactName: CatusTerminal-v${version}-win-x64.${ext}
nsis:
  artifactName: CatusTerminal-v${version}-win-x64-Setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
