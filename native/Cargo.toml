[package]
name = "catus-native"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["native-view"]
native-view = ["dep:wgpu", "dep:pollster", "dep:objc2", "dep:objc2-metal", "dep:objc2-io-surface", "dep:objc2-core-foundation", "dep:crossfont"]

[dependencies]
napi = { version = "=3.14.0", default-features = false, features = ["napi8", "dyn-symbols"] }
napi-derive = "=3.6.10"
cxx = "1.0"
alacritty_terminal = { version = "=0.26.0", default-features = false }
portable-pty = "=0.9.0"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "metal", "wgsl"], optional = true }
pollster = { version = "0.4", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-metal = { version = "0.3", default-features = false, features = ["MTLDevice", "MTLTexture", "MTLAllocation", "MTLResource", "MTLPixelFormat", "objc2-io-surface"], optional = true }

objc2-io-surface = { version = "0.3", default-features = false, features = ["IOSurfaceRef", "IOSurfaceTypes", "objc2-core-foundation", "libc"], optional = true }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["CFDictionary", "CFNumber", "CFString"], optional = true }

crossfont = { version = "=0.9.0", optional = true }

[build-dependencies]
napi-build = "=2.6.0"
cxx-build = "1.0"

[profile.release]
# Rust/LLVM's debuginfo stripping can produce misaligned LINKEDIT on macOS 27.
# Keep the linker output intact; see rust-lang/rust#157750.
strip = "none"
