packages:
  - native

# Keep predev/prebuild compiling the native workspace before the JS bundles.
enablePrePostScripts: true

# Lynxtron builder's patch-package script addresses these from the project root.
publicHoistPattern:
  - app-builder-lib
  - dmg-builder

onlyBuiltDependencies:
  - '@lynx-js/lynxtron'
  - '@lynx-js/lynxtron-builder'
  - electron-winstaller
  - fsevents
patchedDependencies:
  '@lynx-js/lynx-ui-input@3.139.0': patches/@lynx-js__lynx-ui-input@3.139.0.patch
  effect@4.0.0: patches/effect@4.0.0.patch
